<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1>Analog Clock</h1>
    <svg id="clock" width="200" height="200" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="90" stroke="black" stroke-width="4" fill="white"/>
        <text x="100" y="30" text-anchor="middle" font-size="20">12</text>
        <text x="170" y="105" text-anchor="middle" font-size="20">3</text>
        <text x="100" y="180" text-anchor="middle" font-size="20">6</text>
        <text x="30" y="105" text-anchor="middle" font-size="20">9</text>   
        
        <line id="hour-hand" x1="100" y1="100" x2="100" y2="60" stroke="black" stroke-width="4"/>
        <line id="minute-hand" x1="100" y1="100" x2="100" y2="40" stroke="black" stroke-width="2"/>
        <line id="second-hand" x1="100" y1="100" x2="100" y2="30" stroke="red" stroke-width="1"/> 
    </svg>
    <span id="digital-clock"></span>
    <script src="script.js" defer></script>    
       
</body>
</html>
